# cbindgen config. Regenerate the C header with:
#   cargo install cbindgen   (one-time)
#   cbindgen --config cbindgen.toml --output ffi_include/cjson_rs_generated.h
language = "C"
header = "/* Auto-generated from src/ffi.rs by cbindgen. Do not edit by hand. */"
include_guard = "CJSON_RS_GENERATED_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
no_includes = false

[export]
include = ["cjson_rs_parse", "cjson_rs_print", "cjson_rs_print_unformatted", "cjson_rs_free", "cjson_rs_free_string"]

[fn]
prefix = ""
